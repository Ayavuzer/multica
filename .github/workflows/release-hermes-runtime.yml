name: Release Hermes Runtime Image

# Builds and pushes the multica-hermes-runtime image to GHCR
# whenever the relevant files change on main, or on manual dispatch.

on:
  push:
    branches:
      - main
      - 'feat/hermes-cloud-runtime'  # pilot — image build runs from feature branch until merged to main
    paths:
      - 'Dockerfile.hermes-runtime'
      - 'docker/hermes-runtime-entrypoint.sh'
      - 'server/**'
      - '.github/workflows/release-hermes-runtime.yml'
  workflow_dispatch:
    inputs:
      hermes_version:
        description: 'hermes-agent version (latest, or pinned tag like v0.11.0)'
        default: 'latest'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/multica-hermes-runtime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.hermes-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            HERMES_VERSION=${{ github.event.inputs.hermes_version || 'latest' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"
