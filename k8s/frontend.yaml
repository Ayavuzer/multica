apiVersion: apps/v1
kind: Deployment
metadata:
  name: multica-frontend
  namespace: multica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multica-frontend
  template:
    metadata:
      labels:
        app: multica-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/ayavuzer/multica-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: REMOTE_API_URL
              value: "http://multica-backend:8080"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      imagePullSecrets:
        - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: multica-frontend
  namespace: multica
spec:
  selector:
    app: multica-frontend
  ports:
    - port: 3000
      targetPort: 3000
